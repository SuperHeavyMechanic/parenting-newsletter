<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="760" height="360" fill="#f8f9fc" rx="12"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">Tummy-to-Back Roll: The Muscle Chain</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#555">Four muscle groups fire in sequence — each step unlocks the next</text>

  <!-- Step width = ~168px, starting x=20, gap=12 -->

  <!-- STEP 1 -->
  <rect x="20" y="70" width="162" height="230" fill="#eef3fd" rx="10" stroke="#3a6bc9" stroke-width="1.5"/>
  <text x="101" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#3a6bc9">① Head Lifts</text>
  <!-- Baby on tummy, head up - simplified profile -->
  <ellipse cx="101" cy="175" rx="58" ry="22" fill="#f5d7b8" opacity="0.9"/><!-- body -->
  <circle cx="145" cy="155" r="18" fill="#f5d7b8" stroke="#c9956a" stroke-width="1.5"/><!-- head raised -->
  <line x1="125" y1="158" x2="142" y2="168" stroke="#c9956a" stroke-width="2"/><!-- neck -->
  <!-- Arms as supports -->
  <line x1="80" y1="170" x2="68" y2="192" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="168" x2="78" y2="192" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow up on head -->
  <path d="M145 135 L141 145 L149 145 Z" fill="#3a6bc9"/>
  <text x="101" y="228" text-anchor="middle" font-size="10" fill="#444">Neck extensors</text>
  <text x="101" y="243" text-anchor="middle" font-size="10" fill="#444">fire first</text>
  <text x="101" y="265" text-anchor="middle" font-size="10" fill="#777" font-style="italic">Tummy time</text>
  <text x="101" y="280" text-anchor="middle" font-size="10" fill="#777" font-style="italic">builds this</text>

  <!-- Arrow 1→2 -->
  <path d="M183 185 L193 185 L190 181 M193 185 L190 189" stroke="#3a6bc9" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 2 -->
  <rect x="196" y="70" width="162" height="230" fill="#eef3fd" rx="10" stroke="#3a6bc9" stroke-width="1.5"/>
  <text x="277" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#3a6bc9">② Shoulders Follow</text>
  <!-- Body with shoulder rotation indicated -->
  <ellipse cx="277" cy="175" rx="58" ry="22" fill="#f5d7b8" opacity="0.9"/>
  <circle cx="315" cy="157" r="18" fill="#f5d7b8" stroke="#c9956a" stroke-width="1.5"/>
  <line x1="297" y1="160" x2="314" y2="170" stroke="#c9956a" stroke-width="2"/>
  <!-- Arms pushing / rotating -->
  <line x1="250" y1="168" x2="232" y2="188" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <line x1="263" y1="165" x2="248" y2="155" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <!-- Rotation arc on shoulders -->
  <path d="M250 163 A18 18 0 0 1 270 160" stroke="#f4b942" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M270 160 L265 156 M270 160 L274 156" stroke="#f4b942" stroke-width="2" fill="none"/>
  <text x="277" y="228" text-anchor="middle" font-size="10" fill="#444">One shoulder</text>
  <text x="277" y="243" text-anchor="middle" font-size="10" fill="#444">begins to rotate</text>
  <text x="277" y="265" text-anchor="middle" font-size="10" fill="#777" font-style="italic">Pec &amp; shoulder</text>
  <text x="277" y="280" text-anchor="middle" font-size="10" fill="#777" font-style="italic">muscles engage</text>

  <!-- Arrow 2→3 -->
  <path d="M359 185 L369 185 L366 181 M369 185 L366 189" stroke="#3a6bc9" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 3 -->
  <rect x="372" y="70" width="162" height="230" fill="#eef3fd" rx="10" stroke="#3a6bc9" stroke-width="1.5"/>
  <text x="453" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#3a6bc9">③ Core Twists</text>
  <!-- Body partially rolled, diagonal -->
  <ellipse cx="453" cy="180" rx="58" ry="18" fill="#f5d7b8" opacity="0.9" transform="rotate(-20 453 180)"/>
  <circle cx="488" cy="162" r="18" fill="#f5d7b8" stroke="#c9956a" stroke-width="1.5"/>
  <!-- Twist line on torso -->
  <path d="M420 175 Q453 165 485 178" stroke="#f4b942" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Rotation arrow on core -->
  <path d="M445 168 A12 12 0 0 1 460 166" stroke="#f4b942" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M460 166 L456 162 M460 166 L464 163" stroke="#f4b942" stroke-width="2" fill="none"/>
  <text x="453" y="228" text-anchor="middle" font-size="10" fill="#444">Abdominals &amp;</text>
  <text x="453" y="243" text-anchor="middle" font-size="10" fill="#444">obliques fire</text>
  <text x="453" y="265" text-anchor="middle" font-size="10" fill="#777" font-style="italic">Weight shifts</text>
  <text x="453" y="280" text-anchor="middle" font-size="10" fill="#777" font-style="italic">to one side</text>

  <!-- Arrow 3→4 -->
  <path d="M535 185 L545 185 L542 181 M545 185 L542 189" stroke="#3a6bc9" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 4 -->
  <rect x="548" y="70" width="192" height="230" fill="#e8f5ed" rx="10" stroke="#2a9d5c" stroke-width="1.5"/>
  <text x="644" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#2a9d5c">④ Hips Flip!</text>
  <!-- Baby on back -->
  <ellipse cx="644" cy="182" rx="60" ry="20" fill="#f5d7b8" opacity="0.9"/>
  <circle cx="606" cy="165" r="18" fill="#f5d7b8" stroke="#c9956a" stroke-width="1.5"/>
  <!-- Legs up celebrating -->
  <line x1="648" y1="182" x2="660" y2="160" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <line x1="665" y1="183" x2="680" y2="162" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms wide -->
  <line x1="620" y1="170" x2="605" y2="153" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <line x1="630" y1="174" x2="620" y2="157" stroke="#c9956a" stroke-width="3" stroke-linecap="round"/>
  <!-- Star burst -->
  <text x="700" y="145" font-size="22" fill="#f4b942">✦</text>
  <text x="644" y="228" text-anchor="middle" font-size="10" fill="#2a9d5c">Hip flexors complete</text>
  <text x="644" y="243" text-anchor="middle" font-size="10" fill="#2a9d5c">the rotation</text>
  <text x="644" y="265" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Baby lands on back!</text>
  <text x="644" y="280" text-anchor="middle" font-size="10" fill="#555" font-style="italic">May surprise himself</text>

  <!-- Analogy -->
  <rect x="20" y="316" width="720" height="28" fill="#fffbe8" rx="6" stroke="#f4b942" stroke-width="1"/>
  <text x="380" y="334" text-anchor="middle" font-size="11" fill="#7a5c00">Analogy: like a falling domino chain — each group pushes the next. That's why tummy time matters: it builds step ①, which makes steps ②–④ possible.</text>
</svg>
