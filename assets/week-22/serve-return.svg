<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="320" fill="#FAFAF7" rx="12"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F332E">Serve &amp; Return — How Language Circuits Get Built</text>
  <text x="350" y="54" text-anchor="middle" font-size="11" fill="#8E8A80">Each back-and-forth exchange wires a new neural connection</text>

  <!-- Dad (left) -->
  <circle cx="110" cy="145" r="36" fill="#EEF2EA" stroke="#566E58" stroke-width="2"/>
  <text x="110" y="152" text-anchor="middle" font-size="28">👨</text>
  <text x="110" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">Dad</text>
  <text x="110" y="216" text-anchor="middle" font-size="10" fill="#8E8A80">"Heeey Josh!"</text>

  <!-- Baby (right) -->
  <circle cx="590" cy="145" r="36" fill="#F7EEE3" stroke="#C79A6B" stroke-width="2"/>
  <text x="590" y="152" text-anchor="middle" font-size="28">👶</text>
  <text x="590" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#C79A6B">Josh</text>
  <text x="590" y="216" text-anchor="middle" font-size="10" fill="#8E8A80">"Oooh! Ahh!"</text>

  <!-- Arrow 1: Dad → Baby (SERVE) -->
  <path d="M150 125 Q350 75 550 125" stroke="#566E58" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <rect x="300" y="62" width="100" height="22" rx="8" fill="#566E58"/>
  <text x="350" y="77" text-anchor="middle" font-size="11" fill="white" font-weight="bold">① SERVE</text>

  <!-- Arrow 2: Baby → Dad (RETURN) -->
  <path d="M550 165 Q350 215 150 165" stroke="#C79A6B" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <rect x="300" y="196" width="100" height="22" rx="8" fill="#C79A6B"/>
  <text x="350" y="211" text-anchor="middle" font-size="11" fill="white" font-weight="bold">② RETURN</text>

  <!-- Brain build-up indicator in the middle -->
  <rect x="270" y="118" width="160" height="56" rx="8" fill="white" stroke="#D5D0C8" stroke-width="1.2"/>
  <text x="350" y="136" text-anchor="middle" font-size="10" fill="#555A52">Each exchange</text>
  <text x="350" y="149" text-anchor="middle" font-size="10" fill="#555A52">→ neural pathway</text>
  <text x="350" y="162" text-anchor="middle" font-size="10" fill="#555A52">forms &amp; strengthens</text>

  <!-- Repeat cycle arrows -->
  <path d="M155 175 Q110 240 110 260 Q110 278 150 278 Q350 278 550 278 Q590 278 590 260 Q590 240 545 175" stroke="#ABA79D" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <text x="350" y="272" text-anchor="middle" font-size="10" fill="#ABA79D">Repeat 100s of times a day →</text>
  <text x="350" y="284" text-anchor="middle" font-size="10" fill="#ABA79D" font-weight="bold">language architecture</text>

  <!-- Step labels left side -->
  <text x="110" y="238" text-anchor="middle" font-size="9" fill="#566E58">③ Dad waits</text>
  <text x="110" y="250" text-anchor="middle" font-size="9" fill="#566E58">for response</text>

  <text x="590" y="238" text-anchor="middle" font-size="9" fill="#C79A6B">④ Josh coos</text>
  <text x="590" y="250" text-anchor="middle" font-size="9" fill="#C79A6B">back again</text>

  <!-- Markers -->
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#566E58"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#C79A6B"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="350" y="308" text-anchor="middle" font-size="10" fill="#ABA79D" font-style="italic">Like a phone call where both sides take turns — except it's building brain architecture, not just chatting.</text>
</svg>
