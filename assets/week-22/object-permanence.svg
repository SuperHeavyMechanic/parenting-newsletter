<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="320" fill="#FAFAF7" rx="12"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F332E">Object Permanence — When Does "Gone" Mean "Still Exists"?</text>
  <text x="350" y="54" text-anchor="middle" font-size="11" fill="#8E8A80">Josh is at the very beginning of this journey right now</text>

  <!-- Timeline axis -->
  <line x1="60" y1="160" x2="640" y2="160" stroke="#D5D0C8" stroke-width="2"/>
  <!-- Arrowhead -->
  <path d="M636 155 L646 160 L636 165 Z" fill="#D5D0C8"/>

  <!-- Stage 1: 0-3 months -->
  <line x1="100" y1="155" x2="100" y2="170" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-size="10" fill="#ABA79D">0–3 mo</text>
  <rect x="62" y="95" width="76" height="56" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1"/>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#555A52" font-weight="bold">Out of sight</text>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#8E8A80">= out of mind</text>
  <text x="100" y="142" text-anchor="middle" font-size="9" fill="#ABA79D">No searching</text>

  <!-- Stage 2: 4-5 months (Josh now) -->
  <line x1="245" y1="150" x2="245" y2="175" stroke="#566E58" stroke-width="2"/>
  <text x="245" y="190" text-anchor="middle" font-size="10" fill="#566E58" font-weight="bold">~4–5 mo</text>
  <text x="245" y="202" text-anchor="middle" font-size="9" fill="#566E58">← Josh now</text>
  <rect x="172" y="75" width="146" height="68" rx="6" fill="#EEF2EA" stroke="#566E58" stroke-width="1.5"/>
  <text x="245" y="94" text-anchor="middle" font-size="11" fill="#2F332E" font-weight="bold">Brief visual</text>
  <text x="245" y="108" text-anchor="middle" font-size="11" fill="#2F332E" font-weight="bold">memory</text>
  <text x="245" y="124" text-anchor="middle" font-size="10" fill="#555A52">Tracks toy, stares</text>
  <text x="245" y="138" text-anchor="middle" font-size="10" fill="#555A52">at where it went</text>

  <!-- Star marker for current -->
  <text x="245" y="68" text-anchor="middle" font-size="16">⭐</text>

  <!-- Stage 3: 6-8 months -->
  <line x1="410" y1="155" x2="410" y2="170" stroke="#C79A6B" stroke-width="1.5"/>
  <text x="410" y="185" text-anchor="middle" font-size="10" fill="#ABA79D">6–8 mo</text>
  <rect x="344" y="90" width="132" height="62" rx="6" fill="#F7EEE3" stroke="#C79A6B" stroke-width="1"/>
  <text x="410" y="109" text-anchor="middle" font-size="11" fill="#555A52" font-weight="bold">Partial search</text>
  <text x="410" y="123" text-anchor="middle" font-size="10" fill="#8E8A80">Looks for toy where</text>
  <text x="410" y="137" text-anchor="middle" font-size="10" fill="#8E8A80">it was last seen</text>

  <!-- Stage 4: 8-12 months -->
  <line x1="580" y1="155" x2="580" y2="170" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="580" y="185" text-anchor="middle" font-size="10" fill="#ABA79D">8–12 mo</text>
  <rect x="518" y="95" width="124" height="56" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1"/>
  <text x="580" y="114" text-anchor="middle" font-size="11" fill="#555A52" font-weight="bold">Full search</text>
  <text x="580" y="128" text-anchor="middle" font-size="10" fill="#8E8A80">Finds hidden toy;
</text>
  <text x="580" y="142" text-anchor="middle" font-size="10" fill="#8E8A80">"It's still there!"</text>

  <!-- Progress bar below timeline -->
  <rect x="60" y="215" width="580" height="12" rx="6" fill="#E9E4DA"/>
  <!-- Josh's position (~35% of journey) -->
  <rect x="60" y="215" width="203" height="12" rx="6" fill="#566E58"/>
  <circle cx="263" cy="221" r="7" fill="#566E58" stroke="white" stroke-width="2"/>
  <text x="263" y="245" text-anchor="middle" font-size="10" fill="#566E58" font-weight="bold">Josh is here</text>

  <!-- Bottom analogy -->
  <rect x="60" y="260" width="580" height="40" rx="8" fill="#EEF2EA"/>
  <text x="350" y="278" text-anchor="middle" font-size="11" fill="#555A52" font-style="italic">Analogy: CCTV footage on a short delay — Josh can "see" something seconds after it vanishes,</text>
  <text x="350" y="293" text-anchor="middle" font-size="11" fill="#555A52" font-style="italic">but the full recording system won't be online until ~8–12 months.</text>
</svg>
