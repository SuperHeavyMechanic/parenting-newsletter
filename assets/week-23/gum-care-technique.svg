<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="540" height="280" rx="12" fill="#FFFDF9"/>
  <text x="270" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F332E">Infant Gum Care: Before the First Tooth</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#8E8A80">Twice a day: after the first morning feed &amp; before bed (CDC)</text>

  <!-- Step 1 -->
  <rect x="20" y="62" width="150" height="140" rx="12" fill="#EEF2EA"/>
  <text x="95" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">Step 1</text>
  <!-- Hand icon simplified -->
  <rect x="68" y="92" width="54" height="20" rx="10" fill="#C79A6B" opacity="0.7"/>
  <rect x="68" y="88" width="10" height="28" rx="5" fill="#C79A6B"/>
  <rect x="82" y="85" width="10" height="31" rx="5" fill="#C79A6B"/>
  <rect x="96" y="86" width="10" height="30" rx="5" fill="#C79A6B"/>
  <rect x="110" y="88" width="10" height="28" rx="5" fill="#C79A6B"/>
  <!-- Cloth wrapping -->
  <ellipse cx="95" cy="100" rx="30" ry="10" fill="none" stroke="#566E58" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="95" y="142" text-anchor="middle" font-size="11" fill="#2F332E">Wrap a soft,</text>
  <text x="95" y="157" text-anchor="middle" font-size="11" fill="#2F332E">damp gauze or</text>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#2F332E">washcloth around</text>
  <text x="95" y="187" text-anchor="middle" font-size="11" fill="#2F332E">your finger</text>

  <!-- Step 2 -->
  <rect x="195" y="62" width="150" height="140" rx="12" fill="#F7EEE3"/>
  <text x="270" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">Step 2</text>
  <!-- Arc motion symbol -->
  <path d="M230 120 Q270 95 310 120" fill="none" stroke="#C79A6B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="310,110 315,124 304,122" fill="#C79A6B"/>
  <ellipse cx="270" cy="128" rx="35" ry="10" fill="#F3F0E9" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#2F332E">Gently rub</text>
  <text x="270" y="157" text-anchor="middle" font-size="11" fill="#2F332E">along the upper</text>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#2F332E">&amp; lower gum</text>
  <text x="270" y="187" text-anchor="middle" font-size="11" fill="#2F332E">pads in a circle</text>

  <!-- Step 3 -->
  <rect x="370" y="62" width="150" height="140" rx="12" fill="#EEF2EA"/>
  <text x="445" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">Step 3</text>
  <!-- Timer / routine icon -->
  <circle cx="445" cy="118" r="22" fill="#FFFDF9" stroke="#566E58" stroke-width="2"/>
  <line x1="445" y1="102" x2="445" y2="118" stroke="#566E58" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="445" y1="118" x2="456" y2="118" stroke="#C79A6B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="445" y="157" text-anchor="middle" font-size="11" fill="#2F332E">Make it a</text>
  <text x="445" y="172" text-anchor="middle" font-size="11" fill="#2F332E">daily routine —</text>
  <text x="445" y="187" text-anchor="middle" font-size="11" fill="#2F332E">takes ~30 seconds</text>

  <!-- What to avoid -->
  <rect x="20" y="220" width="500" height="48" rx="10" fill="#fef5f5"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Avoid: benzocaine teething gels, frozen teethers, homeopathic tablets</text>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#8E8A80">FDA warns against benzocaine; firm rubber teethers are safest (Mayo Clinic)</text>
</svg>
