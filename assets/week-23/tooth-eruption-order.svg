<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="540" height="320" rx="12" fill="#FFFDF9"/>
  <text x="270" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F332E">Baby Tooth Eruption Order</text>
  <text x="270" y="50" text-anchor="middle" font-size="11" fill="#8E8A80">Most first teeth appear between 6–10 months · Like a zipper, top and bottom in pairs</text>

  <!-- Upper jaw label -->
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#566E58" font-weight="bold">UPPER JAW</text>

  <!-- Upper teeth row (left to right: molar2, molar1, canine, lateral, central, central, lateral, canine, molar1, molar2) -->
  <!-- Only show 10 teeth, label the front ones by eruption order -->
  <!-- Upper central incisors (1st) -->
  <rect x="232" y="90" width="30" height="34" rx="8" fill="#C79A6B" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="247" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">1</text>
  <rect x="278" y="90" width="30" height="34" rx="8" fill="#C79A6B" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="293" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">1</text>

  <!-- Upper lateral incisors (2nd) -->
  <rect x="198" y="90" width="28" height="34" rx="8" fill="#7F9C81" stroke="#566E58" stroke-width="1.5"/>
  <text x="212" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">3</text>
  <rect x="314" y="90" width="28" height="34" rx="8" fill="#7F9C81" stroke="#566E58" stroke-width="1.5"/>
  <text x="328" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">3</text>

  <!-- Upper canines (4th) -->
  <rect x="166" y="93" width="26" height="30" rx="8" fill="#EEF2EA" stroke="#566E58" stroke-width="1.5"/>
  <text x="179" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">5</text>
  <rect x="348" y="93" width="26" height="30" rx="8" fill="#EEF2EA" stroke="#566E58" stroke-width="1.5"/>
  <text x="361" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">5</text>

  <!-- Upper first molars -->
  <rect x="128" y="95" width="32" height="28" rx="8" fill="#F7EEE3" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="144" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">7</text>
  <rect x="380" y="95" width="32" height="28" rx="8" fill="#F7EEE3" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="396" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">7</text>

  <!-- Upper second molars -->
  <rect x="92" y="97" width="30" height="26" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="107" y="115" text-anchor="middle" font-size="11" fill="#8E8A80">9</text>
  <rect x="418" y="97" width="30" height="26" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="433" y="115" text-anchor="middle" font-size="11" fill="#8E8A80">9</text>

  <!-- Midline -->
  <line x1="270" y1="130" x2="270" y2="195" stroke="#E0DBD0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Lower jaw label -->
  <text x="270" y="207" text-anchor="middle" font-size="11" fill="#566E58" font-weight="bold">LOWER JAW</text>

  <!-- Lower central incisors (1st) — erupt first! -->
  <rect x="232" y="215" width="30" height="34" rx="8" fill="#C79A6B" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="247" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">2</text>
  <rect x="278" y="215" width="30" height="34" rx="8" fill="#C79A6B" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="293" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">2</text>

  <!-- Lower lateral incisors -->
  <rect x="198" y="215" width="28" height="34" rx="8" fill="#7F9C81" stroke="#566E58" stroke-width="1.5"/>
  <text x="212" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">4</text>
  <rect x="314" y="215" width="28" height="34" rx="8" fill="#7F9C81" stroke="#566E58" stroke-width="1.5"/>
  <text x="328" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFDF9">4</text>

  <!-- Lower canines -->
  <rect x="166" y="216" width="26" height="30" rx="8" fill="#EEF2EA" stroke="#566E58" stroke-width="1.5"/>
  <text x="179" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">6</text>
  <rect x="348" y="216" width="26" height="30" rx="8" fill="#EEF2EA" stroke="#566E58" stroke-width="1.5"/>
  <text x="361" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#566E58">6</text>

  <!-- Lower first molars -->
  <rect x="128" y="216" width="32" height="28" rx="8" fill="#F7EEE3" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="144" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">8</text>
  <rect x="380" y="216" width="32" height="28" rx="8" fill="#F7EEE3" stroke="#8E6A43" stroke-width="1.5"/>
  <text x="396" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">8</text>

  <!-- Lower second molars -->
  <rect x="92" y="217" width="30" height="26" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="107" y="234" text-anchor="middle" font-size="11" fill="#8E8A80">10</text>
  <rect x="418" y="217" width="30" height="26" rx="6" fill="#F3F0E9" stroke="#ABA79D" stroke-width="1.5"/>
  <text x="433" y="234" text-anchor="middle" font-size="11" fill="#8E8A80">10</text>

  <!-- Legend -->
  <rect x="60" y="268" width="14" height="14" rx="3" fill="#C79A6B"/>
  <text x="80" y="280" font-size="11" fill="#555A52">Central incisors — first to arrive (~6–10 mo)</text>
  <rect x="60" y="288" width="14" height="14" rx="3" fill="#7F9C81"/>
  <text x="80" y="300" font-size="11" fill="#555A52">Lateral incisors (~10–16 mo)</text>
  <rect x="300" y="268" width="14" height="14" rx="3" fill="#EEF2EA" stroke="#566E58" stroke-width="1"/>
  <text x="320" y="280" font-size="11" fill="#555A52">Canines (~16–23 mo)</text>
  <rect x="300" y="288" width="14" height="14" rx="3" fill="#F7EEE3" stroke="#8E6A43" stroke-width="1"/>
  <text x="320" y="300" font-size="11" fill="#555A52">Molars (~12–33 mo)</text>
</svg>
