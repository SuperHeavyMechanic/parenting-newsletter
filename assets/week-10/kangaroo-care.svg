<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="680" height="370" fill="#FAFAF8" rx="12"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2D2D2D">Kangaroo Care (Skin-to-Skin)</text>
  <line x1="80" y1="50" x2="600" y2="50" stroke="#E0DDD8" stroke-width="1.5"/>

  <!-- PARENT body — sitting reclined -->
  <!-- Torso -->
  <rect x="255" y="130" width="170" height="160" rx="40" fill="#D6C4A8" stroke="#A08060" stroke-width="2"/>
  <!-- Head -->
  <circle cx="340" cy="105" r="38" fill="#E8D0B0" stroke="#A08060" stroke-width="2"/>
  <!-- Hair -->
  <path d="M305 90 Q310 68 340 70 Q370 68 375 90" fill="#7A5030" stroke="none"/>
  <!-- Eyes (looking down at baby) -->
  <ellipse cx="328" cy="103" rx="5" ry="6" fill="#5A3820"/>
  <ellipse cx="352" cy="103" rx="5" ry="6" fill="#5A3820"/>
  <!-- Smile -->
  <path d="M325 118 Q340 126 355 118" stroke="#A06040" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms wrapped around baby -->
  <path d="M255 190 Q210 210 220 250 Q225 275 265 270" stroke="#A08060" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M425 190 Q470 210 460 250 Q455 275 415 270" stroke="#A08060" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- BABY on chest (upright, skin-to-skin) -->
  <!-- Baby body -->
  <rect x="300" y="165" width="80" height="95" rx="20" fill="#FFE8D5" stroke="#E0A080" stroke-width="1.5"/>
  <!-- Baby head -->
  <circle cx="340" cy="158" r="28" fill="#FFE8D5" stroke="#E0A080" stroke-width="1.5"/>
  <!-- Baby eyes (closed, sleeping) -->
  <path d="M328 155 Q333 150 338 155" stroke="#8A6040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M342 155 Q347 150 352 155" stroke="#8A6040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Baby mouth (tiny smile) -->
  <path d="M334 165 Q340 169 346 165" stroke="#C08060" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Baby diaper hint -->
  <rect x="308" y="240" width="64" height="18" rx="8" fill="#D0E8FF" stroke="#90B8E0" stroke-width="1"/>

  <!-- BLANKET draped over baby's back -->
  <path d="M220 235 Q240 200 295 195 L295 265 Q240 275 220 265 Z" fill="#B8D8F0" opacity="0.7" stroke="#80B0D8" stroke-width="1.5"/>
  <path d="M460 235 Q440 200 385 195 L385 265 Q440 275 460 265 Z" fill="#B8D8F0" opacity="0.7" stroke="#80B0D8" stroke-width="1.5"/>
  <text x="210" y="222" font-size="11" fill="#5080A0" transform="rotate(-15, 210, 222)">blanket</text>
  <text x="440" y="222" font-size="11" fill="#5080A0" transform="rotate(15, 440, 222)">blanket</text>

  <!-- Labels with arrows -->
  <!-- Bare chest -->
  <line x1="185" y1="165" x2="265" y2="185" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="95" y="155" font-size="12" fill="#555">Bare chest</text>
  <text x="95" y="170" font-size="12" fill="#555">(your warmth,</text>
  <text x="95" y="185" font-size="12" fill="#555">heartbeat, scent)</text>

  <!-- Head turned to side -->
  <line x1="495" y1="148" x2="368" y2="155" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="497" y="145" font-size="12" fill="#555">Head turned</text>
  <text x="497" y="160" font-size="12" fill="#555">to one side</text>

  <!-- Diaper only -->
  <line x1="495" y1="250" x2="375" y2="248" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="497" y="248" font-size="12" fill="#555">Diaper only</text>

  <!-- Upright position -->
  <line x1="185" y1="220" x2="295" y2="220" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="95" y="218" font-size="12" fill="#555">Upright</text>
  <text x="95" y="233" font-size="12" fill="#555">position</text>

  <!-- Analogy box -->
  <rect x="60" y="310" width="560" height="42" rx="8" fill="#EAF4FF" stroke="#90C0E8" stroke-width="1.5"/>
  <text x="340" y="328" text-anchor="middle" font-size="12" fill="#3060A0" font-weight="bold">Everyday analogy: </text>
  <text x="340" y="344" text-anchor="middle" font-size="12" fill="#3060A0">A living incubator — your body regulates their temperature, heart rate, and calms their nervous system.</text>
</svg>
