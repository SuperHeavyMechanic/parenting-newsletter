<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="420" rx="14" fill="#FFFDF9"/>
  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2F332E">The 4-Month Well-Baby Visit</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#8E8A80">What happens, in order</text>

  <!-- Step boxes -->
  <!-- Step 1 -->
  <rect x="30" y="76" width="148" height="72" rx="10" fill="#EEF2EA" stroke="#7F9C81" stroke-width="1.5"/>
  <text x="104" y="100" text-anchor="middle" font-size="22">⚖️</text>
  <text x="104" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F332E">Growth Check</text>
  <text x="104" y="136" text-anchor="middle" font-size="10" fill="#555A52">Weight, length,</text>
  <text x="104" y="148" text-anchor="middle" font-size="10" fill="#555A52">head circumference</text>

  <!-- Arrow 1→2 -->
  <line x1="178" y1="112" x2="206" y2="112" stroke="#C79A6B" stroke-width="2"/>
  <polygon points="206,108 214,112 206,116" fill="#C79A6B"/>

  <!-- Step 2 -->
  <rect x="214" y="76" width="148" height="72" rx="10" fill="#EEF2EA" stroke="#7F9C81" stroke-width="1.5"/>
  <text x="288" y="100" text-anchor="middle" font-size="22">📋</text>
  <text x="288" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F332E">Dev Screen</text>
  <text x="288" y="136" text-anchor="middle" font-size="10" fill="#555A52">CDC checklist review</text>
  <text x="288" y="148" text-anchor="middle" font-size="10" fill="#555A52">with the paediatrician</text>

  <!-- Arrow 2→3 -->
  <line x1="362" y1="112" x2="390" y2="112" stroke="#C79A6B" stroke-width="2"/>
  <polygon points="390,108 398,112 390,116" fill="#C79A6B"/>

  <!-- Step 3 -->
  <rect x="398" y="76" width="148" height="72" rx="10" fill="#EEF2EA" stroke="#7F9C81" stroke-width="1.5"/>
  <text x="472" y="100" text-anchor="middle" font-size="22">💉</text>
  <text x="472" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F332E">Vaccinations</text>
  <text x="472" y="136" text-anchor="middle" font-size="10" fill="#555A52">DTaP, Hib, PCV,</text>
  <text x="472" y="148" text-anchor="middle" font-size="10" fill="#555A52">rotavirus (Indonesia)</text>

  <!-- Arrow 3→4 -->
  <line x1="546" y1="112" x2="574" y2="112" stroke="#C79A6B" stroke-width="2"/>
  <polygon points="574,108 582,112 574,116" fill="#C79A6B"/>

  <!-- Step 4 -->
  <rect x="582" y="76" width="88" height="72" rx="10" fill="#F7EEE3" stroke="#C79A6B" stroke-width="1.5"/>
  <text x="626" y="100" text-anchor="middle" font-size="22">❓</text>
  <text x="626" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">Q &amp; A</text>
  <text x="626" y="136" text-anchor="middle" font-size="10" fill="#8E6A43">Your turn to</text>
  <text x="626" y="148" text-anchor="middle" font-size="10" fill="#8E6A43">ask questions</text>

  <!-- Section label -->
  <text x="350" y="184" text-anchor="middle" font-size="11" fill="#8E8A80">Bring to your visit →</text>

  <!-- Bring list boxes -->
  <rect x="30" y="196" width="196" height="50" rx="8" fill="#FFFDF9" stroke="#D4D0C8" stroke-width="1"/>
  <text x="128" y="216" text-anchor="middle" font-size="20">📱</text>
  <text x="128" y="234" text-anchor="middle" font-size="11" fill="#555A52">CDC Milestone Tracker app</text>
  <text x="128" y="247" text-anchor="middle" font-size="11" fill="#555A52">or printout</text>

  <rect x="252" y="196" width="196" height="50" rx="8" fill="#FFFDF9" stroke="#D4D0C8" stroke-width="1"/>
  <text x="350" y="216" text-anchor="middle" font-size="20">📝</text>
  <text x="350" y="234" text-anchor="middle" font-size="11" fill="#555A52">Your list of questions</text>
  <text x="350" y="247" text-anchor="middle" font-size="11" fill="#555A52">(5 are in this issue)</text>

  <rect x="474" y="196" width="196" height="50" rx="8" fill="#FFFDF9" stroke="#D4D0C8" stroke-width="1"/>
  <text x="572" y="216" text-anchor="middle" font-size="20">🎥</text>
  <text x="572" y="234" text-anchor="middle" font-size="11" fill="#555A52">Short video of Josh's</text>
  <text x="572" y="247" text-anchor="middle" font-size="11" fill="#555A52">tummy time / chuckle</text>

  <!-- After visit section -->
  <rect x="30" y="270" width="640" height="56" rx="10" fill="#F7EEE3"/>
  <text x="350" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E6A43">After the visit: reaction to vaccines</text>
  <text x="350" y="309" text-anchor="middle" font-size="11" fill="#555A52">Low fever / fussiness is normal for 24–48 h. Sore leg where injected. Consult your doctor if fever is above 38°C or lasts &gt;48 h.</text>

  <!-- Analogy -->
  <rect x="30" y="344" width="640" height="58" rx="10" fill="#EEF2EA"/>
  <text x="350" y="365" text-anchor="middle" font-size="11" fill="#566E58" font-weight="bold">Think of it like a car's annual service:</text>
  <text x="350" y="381" text-anchor="middle" font-size="11" fill="#555A52">the paediatrician measures Josh's "stats", tops up his immune defences (vaccines),</text>
  <text x="350" y="397" text-anchor="middle" font-size="11" fill="#555A52">and flags anything worth watching before the next service (6-month visit).</text>
</svg>
