<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="320" fill="#f8f9fb" rx="12"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2340">Infant Sleep Cycle (~60 minutes)</text>
  <text x="350" y="48" text-anchor="middle" font-size="12" fill="#666">Like a washing machine on a 60-min spin cycle — it repeats all night long</text>

  <!-- Cycle 1 -->
  <!-- Active sleep arc -->
  <rect x="40" y="80" width="140" height="60" rx="8" fill="#ffd699" stroke="#e8a020" stroke-width="1.5"/>
  <text x="110" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a00">Active Sleep</text>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#7a4a00">(REM-like)</text>

  <!-- Quiet sleep arc -->
  <rect x="200" y="80" width="140" height="60" rx="8" fill="#b3d9ff" stroke="#2a7fcc" stroke-width="1.5"/>
  <text x="270" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#003a70">Quiet Sleep</text>
  <text x="270" y="124" text-anchor="middle" font-size="11" fill="#003a70">(deep/restorative)</text>

  <!-- Brief waking -->
  <rect x="355" y="95" width="60" height="30" rx="6" fill="#ffe0e0" stroke="#cc4444" stroke-width="1.5"/>
  <text x="385" y="115" text-anchor="middle" font-size="11" fill="#7a0000">Brief</text>

  <!-- Cycle 2 -->
  <rect x="430" y="80" width="110" height="60" rx="8" fill="#ffd699" stroke="#e8a020" stroke-width="1.5"/>
  <text x="485" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a00">Active</text>
  <text x="485" y="124" text-anchor="middle" font-size="11" fill="#7a4a00">Sleep</text>

  <rect x="555" y="80" width="110" height="60" rx="8" fill="#b3d9ff" stroke="#2a7fcc" stroke-width="1.5"/>
  <text x="610" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#003a70">Quiet</text>
  <text x="610" y="124" text-anchor="middle" font-size="11" fill="#003a70">Sleep</text>

  <!-- Arrows connecting -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="180" y1="110" x2="198" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="110" x2="353" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="110" x2="428" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="542" y1="110" x2="553" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Timeline bar -->
  <rect x="40" y="180" width="630" height="14" rx="7" fill="#e0e0e0"/>
  <rect x="40" y="180" width="315" height="14" rx="7" fill="#b8d4f0"/>
  <text x="40" y="210" font-size="11" fill="#555">0 min</text>
  <text x="345" y="210" text-anchor="middle" font-size="11" fill="#555">~30 min</text>
  <text x="670" y="210" text-anchor="end" font-size="11" fill="#555">~60 min</text>
  <text x="355" y="174" text-anchor="middle" font-size="10" fill="#888">← cycle repeats →</text>

  <!-- Bottom notes -->
  <rect x="40" y="225" width="300" height="52" rx="8" fill="#fff8e6" stroke="#e8a020" stroke-width="1"/>
  <text x="55" y="244" font-size="11" fill="#7a4a00" font-weight="bold">Active sleep:</text>
  <text x="55" y="259" font-size="11" fill="#555">Twitching, fast eye movements,</text>
  <text x="55" y="273" font-size="11" fill="#555">irregular breathing — totally normal!</text>

  <rect x="360" y="225" width="300" height="52" rx="8" fill="#e8f4ff" stroke="#2a7fcc" stroke-width="1"/>
  <text x="375" y="244" font-size="11" fill="#003a70" font-weight="bold">Quiet sleep:</text>
  <text x="375" y="259" font-size="11" fill="#555">Still, even breathing, deeply</text>
  <text x="375" y="273" font-size="11" fill="#555">restorative — brain is consolidating</text>

  <!-- Brief wake label -->
  <text x="385" y="145" text-anchor="middle" font-size="10" fill="#cc4444">waking</text>
  <text x="385" y="157" text-anchor="middle" font-size="10" fill="#cc4444">(normal!)</text>
</svg>
