<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="520" height="380" fill="#FAFAF7" rx="12"/>

  <!-- Title -->
  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2C">Fontanel (Soft Spots)</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#666">Top-down view of a baby's head</text>

  <!-- Head outline (oval) -->
  <ellipse cx="260" cy="190" rx="130" ry="150" fill="#FDE8D4" stroke="#C97A4A" stroke-width="2.5"/>

  <!-- Skull bone texture lines (subtle) -->
  <!-- Coronal suture (front to back split) -->
  <line x1="260" y1="58" x2="260" y2="322" stroke="#C97A4A" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- Sagittal suture (side to side at mid) -->
  <path d="M140,180 Q200,200 260,195 Q310,190 375,200" fill="none" stroke="#C97A4A" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Anterior fontanel (diamond, near front/top) -->
  <polygon points="260,90 230,115 260,138 290,115" fill="#FFEAA7" stroke="#E6A817" stroke-width="2.5"/>
  <!-- Label: Anterior fontanel -->
  <line x1="290" y1="113" x2="360" y2="95" stroke="#E6A817" stroke-width="1.2"/>
  <rect x="348" y="74" width="140" height="36" fill="white" stroke="#E6A817" stroke-width="1" rx="4"/>
  <text x="418" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#B8860B">Anterior fontanel</text>
  <text x="418" y="104" text-anchor="middle" font-size="10" fill="#666">(closes ~12–18 months)</text>

  <!-- Posterior fontanel (smaller triangle, near back) -->
  <polygon points="260,282 245,268 275,268" fill="#B5EAD7" stroke="#2E8B57" stroke-width="2"/>
  <!-- Label: Posterior fontanel -->
  <line x1="245" y1="272" x2="160" y2="285" stroke="#2E8B57" stroke-width="1.2"/>
  <rect x="22" y="270" width="140" height="36" fill="white" stroke="#2E8B57" stroke-width="1" rx="4"/>
  <text x="92" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E8B57">Posterior fontanel</text>
  <text x="92" y="300" text-anchor="middle" font-size="10" fill="#666">(closes ~2–3 months)</text>

  <!-- Face direction label -->
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#999">▲ facing up (top of head)</text>

  <!-- FRONT / BACK labels -->
  <text x="260" y="72" text-anchor="middle" font-size="9" fill="#AAA">FRONT</text>
  <text x="260" y="330" text-anchor="middle" font-size="9" fill="#AAA">BACK</text>

  <!-- Analogy box -->
  <rect x="40" y="355" width="440" height="18" fill="none"/>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">Like a trapdoor so the brain can grow — the gaps close naturally over time.</text>
</svg>
