<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="520" height="380" fill="#FAFAF7" rx="12"/>

  <!-- Title -->
  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2C">Growth Percentile Chart</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#666">Weight over first 3 months</text>

  <!-- Chart area -->
  <rect x="60" y="65" width="400" height="240" fill="white" stroke="#DDD" stroke-width="1" rx="4"/>

  <!-- Y-axis label -->
  <text x="18" y="185" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90, 18, 185)">Weight (kg)</text>

  <!-- Y-axis ticks and labels -->
  <line x1="60" y1="65" x2="60" y2="305" stroke="#BBB" stroke-width="1"/>
  <text x="54" y="310" text-anchor="end" font-size="9" fill="#888">2</text>
  <text x="54" y="262" text-anchor="end" font-size="9" fill="#888">3</text>
  <text x="54" y="214" text-anchor="end" font-size="9" fill="#888">4</text>
  <text x="54" y="166" text-anchor="end" font-size="9" fill="#888">5</text>
  <text x="54" y="118" text-anchor="end" font-size="9" fill="#888">6</text>
  <text x="54" y="70" text-anchor="end" font-size="9" fill="#888">7</text>

  <!-- Gridlines -->
  <line x1="60" y1="305" x2="460" y2="305" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="257" x2="460" y2="257" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="209" x2="460" y2="209" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="161" x2="460" y2="161" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="113" x2="460" y2="113" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- X-axis -->
  <line x1="60" y1="305" x2="460" y2="305" stroke="#BBB" stroke-width="1"/>
  <!-- X tick labels (weeks) -->
  <text x="60" y="322" text-anchor="middle" font-size="9" fill="#888">birth</text>
  <text x="160" y="322" text-anchor="middle" font-size="9" fill="#888">4 wk</text>
  <text x="260" y="322" text-anchor="middle" font-size="9" fill="#888">8 wk</text>
  <text x="360" y="322" text-anchor="middle" font-size="9" fill="#888">12 wk</text>
  <text x="460" y="322" text-anchor="middle" font-size="9" fill="#888">16 wk</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#666">Age</text>

  <!-- Percentile curves — 97th -->
  <polyline points="60,200 160,154 260,118 360,94 460,78" fill="none" stroke="#C8DEFA" stroke-width="1.5"/>
  <text x="462" y="76" font-size="9" fill="#AAC" dominant-baseline="middle">97th</text>

  <!-- 75th -->
  <polyline points="60,224 160,183 260,153 360,131 460,117" fill="none" stroke="#A8C8F0" stroke-width="1.5"/>
  <text x="462" y="115" font-size="9" fill="#88B" dominant-baseline="middle">75th</text>

  <!-- 50th — highlighted -->
  <polyline points="60,240 160,205 260,178 360,159 460,146" fill="none" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="462" y="144" font-size="9" fill="#4A90D9" font-weight="bold" dominant-baseline="middle">50th</text>

  <!-- 25th -->
  <polyline points="60,254 160,224 260,201 360,186 460,175" fill="none" stroke="#A8C8F0" stroke-width="1.5"/>
  <text x="462" y="173" font-size="9" fill="#88B" dominant-baseline="middle">25th</text>

  <!-- 3rd -->
  <polyline points="60,268 160,244 260,228 360,217 460,210" fill="none" stroke="#C8DEFA" stroke-width="1.5"/>
  <text x="462" y="208" font-size="9" fill="#AAC" dominant-baseline="middle">3rd</text>

  <!-- Baby's dot — on 25th percentile -->
  <circle cx="260" cy="201" r="7" fill="#E05A2B" stroke="white" stroke-width="2"/>
  <text x="255" y="194" font-size="9" fill="#E05A2B" font-weight="bold">your</text>
  <text x="252" y="204" font-size="9" fill="#E05A2B" font-weight="bold">baby</text>

  <!-- Arrow from dot -->
  <line x1="272" y1="199" x2="295" y2="192" stroke="#E05A2B" stroke-width="1.2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E05A2B"/>
    </marker>
  </defs>

  <!-- Analogy box -->
  <rect x="40" y="342" width="440" height="30" fill="#EEF5FF" rx="6" stroke="#C8DEFA" stroke-width="1"/>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#333">
    <tspan font-style="italic">The lane matters, not which one — steady tracking along any curve is healthy growth.</tspan>
  </text>
</svg>
