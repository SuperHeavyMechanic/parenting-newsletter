<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="700" height="340" fill="#fafafa" rx="12"/>
  <text x="350" y="36" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Baby Blues vs. Postpartum Depression</text>
  <text x="350" y="56" font-size="12" fill="#555" text-anchor="middle">How long sadness lasts tells them apart</text>

  <!-- Timeline axis -->
  <line x1="60" y1="180" x2="640" y2="180" stroke="#ccc" stroke-width="2"/>

  <!-- Week labels on axis -->
  <text x="60" y="200" font-size="11" fill="#777" text-anchor="middle">Birth</text>
  <text x="165" y="200" font-size="11" fill="#777" text-anchor="middle">Wk 1</text>
  <text x="270" y="200" font-size="11" fill="#777" text-anchor="middle">Wk 2</text>
  <text x="375" y="200" font-size="11" fill="#777" text-anchor="middle">Wk 3</text>
  <text x="480" y="200" font-size="11" fill="#777" text-anchor="middle">Wk 4</text>
  <text x="585" y="200" font-size="11" fill="#777" text-anchor="middle">Wk 5+</text>

  <!-- Tick marks -->
  <line x1="60" y1="176" x2="60" y2="184" stroke="#aaa" stroke-width="1.5"/>
  <line x1="165" y1="176" x2="165" y2="184" stroke="#aaa" stroke-width="1.5"/>
  <line x1="270" y1="176" x2="270" y2="184" stroke="#aaa" stroke-width="1.5"/>
  <line x1="375" y1="176" x2="375" y2="184" stroke="#aaa" stroke-width="1.5"/>
  <line x1="480" y1="176" x2="480" y2="184" stroke="#aaa" stroke-width="1.5"/>
  <line x1="585" y1="176" x2="585" y2="184" stroke="#aaa" stroke-width="1.5"/>

  <!-- Baby blues band (birth to day 14 ≈ wk 2) -->
  <rect x="60" y="100" width="210" height="60" rx="8" fill="#b3d9ff" opacity="0.8"/>
  <text x="165" y="126" font-size="13" font-weight="bold" fill="#1a4a8a" text-anchor="middle">😢 Baby Blues</text>
  <text x="165" y="145" font-size="11" fill="#1a4a8a" text-anchor="middle">Days 3–14 · Resolves on its own</text>

  <!-- Divider at wk 2 -->
  <line x1="270" y1="85" x2="270" y2="180" stroke="#e07b39" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="270" y="82" font-size="10" fill="#e07b39" text-anchor="middle">Day 14</text>

  <!-- PPD band (day 14 onward) -->
  <rect x="270" y="100" width="360" height="60" rx="8" fill="#ffd6cc" opacity="0.85"/>
  <text x="450" y="126" font-size="13" font-weight="bold" fill="#9b2226" text-anchor="middle">⚠️ Postpartum Depression</text>
  <text x="450" y="145" font-size="11" fill="#9b2226" text-anchor="middle">Persists past 2 weeks · Needs medical support</text>

  <!-- Key differences table -->
  <rect x="60" y="215" width="580" height="100" rx="8" fill="#f0f0f0"/>
  <text x="100" y="236" font-size="11" font-weight="bold" fill="#333">Baby Blues</text>
  <text x="400" y="236" font-size="11" font-weight="bold" fill="#333">Postpartum Depression</text>
  <line x1="60" y1="242" x2="640" y2="242" stroke="#ccc" stroke-width="1"/>
  <text x="100" y="258" font-size="11" fill="#444">Mild sadness, teary, mood swings</text>
  <text x="400" y="258" font-size="11" fill="#444">Intense sadness, hopelessness</text>
  <text x="100" y="274" font-size="11" fill="#444">Goes away without treatment</text>
  <text x="400" y="274" font-size="11" fill="#444">Needs therapy and/or medication</text>
  <text x="100" y="290" font-size="11" fill="#444">Affects ~80% of new mums</text>
  <text x="400" y="290" font-size="11" fill="#444">Affects 1 in 7 new mums</text>
  <text x="100" y="306" font-size="11" fill="#444">Still bonds with baby normally</text>
  <text x="400" y="306" font-size="11" fill="#444">May feel distant from baby</text>
  <line x1="360" y1="215" x2="360" y2="315" stroke="#ccc" stroke-width="1"/>
</svg>
