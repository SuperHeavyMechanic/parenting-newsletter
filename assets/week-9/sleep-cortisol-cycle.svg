<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="640" height="380" fill="#fafafa" rx="12"/>
  <text x="320" y="36" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The 3 AM Cortisol Spiral</text>
  <text x="320" y="56" font-size="12" fill="#555" text-anchor="middle">Analogy: a smoke alarm that won't stop — even when there's no fire</text>

  <!-- Cycle nodes arranged as a circle -->
  <!-- Node 1: Top — Sleep deprivation -->
  <rect x="200" y="70" width="240" height="50" rx="10" fill="#ffe8cc" stroke="#d9730d" stroke-width="2"/>
  <text x="320" y="91" font-size="13" font-weight="bold" fill="#7c3810" text-anchor="middle">😴 Sleep Deprivation</text>
  <text x="320" y="108" font-size="11" fill="#7c3810" text-anchor="middle">Multiple wake-ups each night</text>

  <!-- Arrow down-right -->
  <path d="M 440 95 Q 530 100 540 160" fill="none" stroke="#9b2226" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Node 2: Right — Cortisol spike -->
  <rect x="460" y="160" width="160" height="50" rx="10" fill="#ffd6cc" stroke="#9b2226" stroke-width="2"/>
  <text x="540" y="182" font-size="12" font-weight="bold" fill="#7b1212" text-anchor="middle">⚡ Cortisol Spike</text>
  <text x="540" y="198" font-size="11" fill="#7b1212" text-anchor="middle">Stress hormone surges</text>

  <!-- Arrow down -->
  <path d="M 540 210 Q 530 270 440 295" fill="none" stroke="#9b2226" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Node 3: Bottom — Anxious / wired feeling -->
  <rect x="200" y="295" width="240" height="50" rx="10" fill="#f8d7da" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="316" font-size="13" font-weight="bold" fill="#7b1212" text-anchor="middle">🧠 Wired &amp; Anxious Mind</text>
  <text x="320" y="334" font-size="11" fill="#7b1212" text-anchor="middle">Racing thoughts · "what if" spirals</text>

  <!-- Arrow left -->
  <path d="M 200 320 Q 110 300 100 240" fill="none" stroke="#9b2226" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Node 4: Left — Can't fall back to sleep -->
  <rect x="20" y="160" width="160" height="50" rx="10" fill="#e9d5ff" stroke="#6741d9" stroke-width="2"/>
  <text x="100" y="182" font-size="12" font-weight="bold" fill="#3b0764" text-anchor="middle">🔄 Can't Fall Back</text>
  <text x="100" y="198" font-size="11" fill="#3b0764" text-anchor="middle">Sleep feels impossible</text>

  <!-- Arrow up-right back to top -->
  <path d="M 100 160 Q 110 90 200 92" fill="none" stroke="#9b2226" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Centre label -->
  <text x="320" y="212" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">↻ Repeating cycle</text>

  <!-- Break-the-cycle box -->
  <rect x="100" y="360" width="440" height="16" rx="4" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1"/>
  <text x="320" y="372" font-size="10.5" fill="#1a5e2a" text-anchor="middle">Break it: ask for help, share night shifts, nap when baby naps — cortisol drops with real rest</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b2226"/>
    </marker>
  </defs>
</svg>
