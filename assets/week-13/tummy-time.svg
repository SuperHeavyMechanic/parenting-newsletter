<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="520" height="210" fill="#fdf8f0" rx="12"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a3728">Tummy Time: Building Neck &amp; Core Strength</text>

  <!-- WEEK 0-2: Flat head, no lift -->
  <rect x="15" y="38" width="150" height="155" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="90" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">0–2 weeks</text>
  <!-- Floor line -->
  <line x1="30" y1="145" x2="150" y2="145" stroke="#bcaaa4" stroke-width="2"/>
  <!-- Baby lying flat -->
  <!-- Body -->
  <ellipse cx="90" cy="140" rx="45" ry="14" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <!-- Head flat -->
  <circle cx="45" cy="140" r="16" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <!-- Face (side profile, flat) -->
  <circle cx="40" cy="137" r="2.5" fill="#6d4c41"/>
  <line x1="35" y1="145" x2="50" y2="145" stroke="#d4a87a" stroke-width="1"/>
  <text x="90" y="170" text-anchor="middle" font-size="10" fill="#bf360c">Head on mat,</text>
  <text x="90" y="182" text-anchor="middle" font-size="10" fill="#bf360c">no lift yet</text>

  <!-- WEEK 4-6: 45° lift -->
  <rect x="185" y="38" width="150" height="155" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">4–6 weeks</text>
  <line x1="200" y1="145" x2="320" y2="145" stroke="#bcaaa4" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="260" cy="140" rx="45" ry="14" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <!-- Head at ~45° -->
  <line x1="220" y1="140" x2="205" y2="115" stroke="#d4a87a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="200" cy="108" r="16" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <circle cx="196" cy="105" r="2.5" fill="#6d4c41"/>
  <!-- Angle arc -->
  <path d="M215 140 A18,18 0 0,1 218 124" stroke="#388e3c" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <text x="230" y="132" font-size="9" fill="#388e3c">~45°</text>
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#1b5e20">Head up briefly,</text>
  <text x="260" y="182" text-anchor="middle" font-size="10" fill="#1b5e20">neck strengthening</text>

  <!-- WEEK 8-10: 90° lift -->
  <rect x="355" y="38" width="150" height="155" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="430" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">8–10 weeks</text>
  <line x1="370" y1="145" x2="490" y2="145" stroke="#bcaaa4" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="430" cy="140" rx="45" ry="14" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <!-- Head at ~90° -->
  <line x1="390" y1="138" x2="390" y2="110" stroke="#d4a87a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="390" cy="96" r="16" fill="#ffe0b2" stroke="#d4a87a" stroke-width="1.5"/>
  <circle cx="386" cy="94" r="2.5" fill="#6d4c41"/>
  <circle cx="394" cy="94" r="2.5" fill="#6d4c41"/>
  <!-- Smile -->
  <path d="M384 102 Q390 107 396 102" stroke="#6d4c41" stroke-width="1.5" fill="none"/>
  <!-- Angle arc -->
  <path d="M400 138 A18,18 0 0,1 400 120" stroke="#1565c0" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <text x="408" y="128" font-size="9" fill="#1565c0">~90°</text>
  <text x="430" y="170" text-anchor="middle" font-size="10" fill="#0d47a1">Head up &amp; steady,</text>
  <text x="430" y="182" text-anchor="middle" font-size="10" fill="#0d47a1">looks around!</text>
</svg>
