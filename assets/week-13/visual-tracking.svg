<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="520" height="200" fill="#fdf8f0" rx="12"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a3728">Visual Tracking: Following a Moving Object</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#777">Like a security camera slowly panning — baby's eyes lock on and follow</text>

  <!-- Baby face (front view) -->
  <circle cx="80" cy="115" r="42" fill="#ffe0b2" stroke="#d4a87a" stroke-width="2"/>

  <!-- STAGE 1: object at left, eyes center-left -->
  <rect x="150" y="95" width="80" height="70" rx="6" fill="#fff8e1" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="190" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#f57f17">Stage 1</text>
  <!-- Eyes looking left -->
  <ellipse cx="175" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="173" cy="133" r="5" fill="#4e342e"/>
  <ellipse cx="205" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="203" cy="133" r="5" fill="#4e342e"/>
  <text x="190" y="155" text-anchor="middle" font-size="9" fill="#555">Object appears</text>

  <!-- STAGE 2: object moving, eyes center -->
  <rect x="240" y="95" width="80" height="70" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="280" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">Stage 2</text>
  <ellipse cx="265" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="265" cy="133" r="5" fill="#4e342e"/>
  <ellipse cx="295" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="295" cy="133" r="5" fill="#4e342e"/>
  <text x="280" y="155" text-anchor="middle" font-size="9" fill="#555">Tracking it</text>

  <!-- STAGE 3: object at right, eyes right -->
  <rect x="330" y="95" width="80" height="70" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="370" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Stage 3</text>
  <ellipse cx="355" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="357" cy="133" r="5" fill="#4e342e"/>
  <ellipse cx="385" cy="133" rx="10" ry="9" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="387" cy="133" r="5" fill="#4e342e"/>
  <text x="370" y="155" text-anchor="middle" font-size="9" fill="#555">Followed!</text>

  <!-- Moving toy arc above -->
  <!-- Toy at left -->
  <circle cx="175" cy="75" r="10" fill="#ef9a9a" stroke="#e53935" stroke-width="1.5"/>
  <text x="175" y="79" text-anchor="middle" font-size="10">🔴</text>
  <!-- Arrow path -->
  <path d="M185 72 Q280 50 365 72" stroke="#9e9e9e" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowGrey)"/>
  <!-- Toy at right -->
  <circle cx="370" cy="75" r="10" fill="#ef9a9a" stroke="#e53935" stroke-width="1.5"/>
  <text x="370" y="79" text-anchor="middle" font-size="10">🔴</text>

  <!-- Object moving label -->
  <text x="280" y="60" text-anchor="middle" font-size="9" fill="#9e9e9e">toy moving slowly side to side</text>

  <!-- Range label -->
  <text x="450" y="130" text-anchor="middle" font-size="10" fill="#555">Best range:</text>
  <text x="450" y="143" text-anchor="middle" font-size="10" fill="#555">20–30 cm</text>
  <text x="450" y="156" text-anchor="middle" font-size="10" fill="#555">from face</text>

  <defs>
    <marker id="arrowGrey" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>
