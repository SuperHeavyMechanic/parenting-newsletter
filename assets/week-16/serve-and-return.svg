<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="640" height="320" fill="#fdf8f2" rx="12"/>

  <!-- Title -->
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a2a1a">Serve &amp; Return: Baby's First Conversations</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#7a6a5a">Like a tennis rally — each exchange builds new brain connections</text>

  <!-- Baby figure (left) -->
  <!-- Head -->
  <circle cx="110" cy="110" r="30" fill="#f9d9b0" stroke="#c0956a" stroke-width="2"/>
  <!-- Face -->
  <circle cx="102" cy="105" r="4" fill="#5a3e28"/>
  <circle cx="118" cy="105" r="4" fill="#5a3e28"/>
  <path d="M103 118 Q110 125 117 118" stroke="#5a3e28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="110" cy="165" rx="26" ry="32" fill="#b8d4f0" stroke="#7aa8d8" stroke-width="1.5"/>
  <!-- Arms -->
  <path d="M84 150 Q60 140 55 125" stroke="#f9d9b0" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M136 150 Q160 140 165 125" stroke="#f9d9b0" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <text x="110" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a2a1a">Baby</text>

  <!-- SERVE bubble (baby to parent) -->
  <ellipse cx="185" cy="90" rx="55" ry="22" fill="#ffe8b0" stroke="#d4a020" stroke-width="1.5"/>
  <text x="185" y="86" text-anchor="middle" font-size="10" fill="#7a4a00">Baby "serves":</text>
  <text x="185" y="99" text-anchor="middle" font-size="10" fill="#7a4a00">coos · smiles · reaches</text>
  <!-- Arrow → -->
  <path d="M248 90 L340 90" stroke="#d4a020" stroke-width="2.5" marker-end="url(#arr1)" fill="none"/>

  <!-- RETURN bubble (parent to baby) -->
  <ellipse cx="455" cy="210" rx="60" ry="22" fill="#c8eac8" stroke="#3a8a3a" stroke-width="1.5"/>
  <text x="455" y="206" text-anchor="middle" font-size="10" fill="#1a5a1a">Parent "returns":</text>
  <text x="455" y="219" text-anchor="middle" font-size="10" fill="#1a5a1a">mirrors · names it · responds</text>
  <!-- Arrow ← -->
  <path d="M340 210 L248 210" stroke="#3a8a3a" stroke-width="2.5" marker-end="url(#arr2)" fill="none"/>

  <!-- Connecting vertical arrow down on right -->
  <path d="M530 100 Q560 155 530 200" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr3)"/>

  <!-- Parent figure (right) -->
  <circle cx="530" cy="110" r="30" fill="#f0c8a0" stroke="#b07040" stroke-width="2"/>
  <!-- Face -->
  <circle cx="522" cy="105" r="4" fill="#3a2010"/>
  <circle cx="538" cy="105" r="4" fill="#3a2010"/>
  <path d="M521 120 Q530 128 539 120" stroke="#3a2010" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="530" cy="165" rx="28" ry="34" fill="#d0b0e0" stroke="#9070b8" stroke-width="1.5"/>
  <!-- Label -->
  <text x="530" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a2a1a">Dad / Mum</text>

  <!-- Neural growth in center bottom -->
  <rect x="235" y="240" width="170" height="52" rx="8" fill="#fff0e8" stroke="#d08040" stroke-width="1.5"/>
  <text x="320" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3a00">Each rally = a new</text>
  <text x="320" y="273" text-anchor="middle" font-size="11" fill="#7a3a00">neural connection formed</text>
  <text x="320" y="286" text-anchor="middle" font-size="10" fill="#b06020">Repeat thousands of times a day</text>

  <!-- Arrows definitions -->
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d4a020"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#3a8a3a"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#888"/>
    </marker>
  </defs>
</svg>
