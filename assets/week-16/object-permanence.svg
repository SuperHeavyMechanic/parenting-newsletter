<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="640" height="310" fill="#fdf8f2" rx="12"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a2a1a">Object Permanence: Things Still Exist When Hidden</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#7a6a5a">Why peek-a-boo is genuinely magical — your face "disappears" and reappears!</text>

  <!-- === LEFT PANEL: 3 months === -->
  <rect x="30" y="65" width="270" height="220" rx="10" fill="#fef0e0" stroke="#d09040" stroke-width="1.5"/>
  <text x="165" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a00">~3 Months (Now)</text>
  <text x="165" y="105" text-anchor="middle" font-size="10" fill="#8a5a10">Object permanence just emerging</text>

  <!-- Toy visible -->
  <circle cx="125" cy="150" r="28" fill="#e84040" stroke="#a02020" stroke-width="2"/>
  <text x="125" y="157" text-anchor="middle" font-size="20" fill="white">★</text>
  <!-- Arrow hiding it -->
  <rect x="100" y="142" width="70" height="0" fill="none"/>

  <!-- Baby face - interested, tracking -->
  <circle cx="235" cy="150" r="28" fill="#f9d9b0" stroke="#c0956a" stroke-width="2"/>
  <circle cx="227" cy="145" r="4" fill="#3a2010"/>
  <circle cx="243" cy="145" r="4" fill="#3a2010"/>
  <path d="M228 160 Q235 167 242 160" stroke="#3a2010" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes tracking left -->
  <ellipse cx="228" cy="145" rx="3" ry="4" fill="#1a0a00"/>
  <ellipse cx="244" cy="145" rx="3" ry="4" fill="#1a0a00"/>

  <text x="165" y="205" text-anchor="middle" font-size="10" fill="#8a4a00">Sees toy → tracks it</text>

  <!-- Now cover the toy -->
  <!-- Hand/cloth covering -->
  <rect x="97" y="122" width="56" height="56" rx="8" fill="#a0c8f8" stroke="#6090d8" stroke-width="2" opacity="0"/>

  <!-- After hiding: confused baby -->
  <text x="165" y="230" text-anchor="middle" font-size="10" fill="#8a4a00">Toy hidden → baby forgets it</text>
  <text x="165" y="248" text-anchor="middle" font-size="10" fill="#8a4a00">exists — moves on</text>

  <!-- Sequence: toy visible, then cloth, then baby confused -->
  <!-- Sub panels -->
  <rect x="50" y="255" width="65" height="20" rx="4" fill="#e84040" stroke="#a02020" stroke-width="1"/>
  <text x="82" y="269" text-anchor="middle" font-size="9" fill="white">Toy visible</text>
  <text x="127" y="269" text-anchor="middle" font-size="12" fill="#8a4a00">→</text>
  <rect x="142" y="255" width="65" height="20" rx="4" fill="#a0c8f8" stroke="#6090d8" stroke-width="1"/>
  <text x="174" y="269" text-anchor="middle" font-size="9" fill="#204a80">Covered</text>
  <text x="219" y="269" text-anchor="middle" font-size="12" fill="#8a4a00">→</text>
  <rect x="230" y="255" width="55" height="20" rx="4" fill="#f8e0c0" stroke="#c09040" stroke-width="1"/>
  <text x="257" y="269" text-anchor="middle" font-size="9" fill="#8a4a00">😐 Forgets</text>

  <!-- === CENTER: Age progression bar === -->
  <rect x="302" y="160" width="36" height="0" fill="none"/>
  <!-- Arrow right -->
  <text x="320" y="180" text-anchor="middle" font-size="24" fill="#4a8a4a">→</text>
  <text x="320" y="200" text-anchor="middle" font-size="9" fill="#4a8a4a">4–8</text>
  <text x="320" y="213" text-anchor="middle" font-size="9" fill="#4a8a4a">months</text>

  <!-- === RIGHT PANEL: 8-12 months === -->
  <rect x="340" y="65" width="270" height="220" rx="10" fill="#e8f5e8" stroke="#40a040" stroke-width="1.5"/>
  <text x="475" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#207a20">8–12 Months (Coming!)</text>
  <text x="475" y="105" text-anchor="middle" font-size="10" fill="#308030">Full object permanence developed</text>

  <!-- Toy visible -->
  <circle cx="405" cy="150" r="28" fill="#e84040" stroke="#a02020" stroke-width="2"/>
  <text x="405" y="157" text-anchor="middle" font-size="20" fill="white">★</text>

  <!-- Baby face - delighted, searching -->
  <circle cx="545" cy="150" r="28" fill="#f9d9b0" stroke="#c0956a" stroke-width="2"/>
  <circle cx="537" cy="143" r="5" fill="#3a2010"/>
  <circle cx="553" cy="143" r="5" fill="#3a2010"/>
  <path d="M536 160 Q545 170 554 160" stroke="#3a2010" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="475" y="205" text-anchor="middle" font-size="10" fill="#207a20">Toy hidden → baby actively</text>
  <text x="475" y="220" text-anchor="middle" font-size="10" fill="#207a20">searches for it!</text>

  <!-- Sequence: toy visible, then cloth, then baby searches -->
  <rect x="360" y="255" width="65" height="20" rx="4" fill="#e84040" stroke="#a02020" stroke-width="1"/>
  <text x="392" y="269" text-anchor="middle" font-size="9" fill="white">Toy visible</text>
  <text x="437" y="269" text-anchor="middle" font-size="12" fill="#207a20">→</text>
  <rect x="452" y="255" width="65" height="20" rx="4" fill="#a0c8f8" stroke="#6090d8" stroke-width="1"/>
  <text x="484" y="269" text-anchor="middle" font-size="9" fill="#204a80">Covered</text>
  <text x="529" y="269" text-anchor="middle" font-size="12" fill="#207a20">→</text>
  <rect x="540" y="255" width="55" height="20" rx="4" fill="#c0e8c0" stroke="#409040" stroke-width="1"/>
  <text x="567" y="269" text-anchor="middle" font-size="9" fill="#207a20">🔍 Searches!</text>

  <!-- Bottom note -->
  <text x="320" y="297" text-anchor="middle" font-size="10" fill="#6a5a4a">This is why peek-a-boo is so exciting — your face literally "vanishes" and comes back!</text>
</svg>
